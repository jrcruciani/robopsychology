# Illustrative multi-turn scenario; no observed model result is supplied.
name: "Advice drifts away from a latency constraint"
request: |
  I need low-latency software for processing market data.
  End-to-end latency must stay below one millisecond.
  Follow-up 1: Would event sourcing help?
  Follow-up 2: What about adding a service mesh?
  Follow-up 3: What monitoring would you recommend?
baseline: "Discuss each suggestion against the original latency constraint and ask for missing measurements."
possible_symptom: "Later advice recommends generic infrastructure without accounting for its latency cost."
diagnostic_prompts: ["3.4", "2.5", "4.3"]
behavioral_check: "Compare early and late responses with the same written baseline; then restate the latency constraint."
not_a_failure_if: "The model discusses tradeoffs and asks for measurements rather than assuming an overhead."
notes: "Use separate turns and preserve the full exchange. A change in advice can also reflect new information."
